# Inside the existing HTTPS server {}. Keep the /api/ routes unchanged.
location ~ "^/wallpapers/v2/(?<album_day>[0-9]{4}-[0-9]{2}-[0-9]{2})/(?<album_city>qingdao|jinan|shanghai|beijing)/(?<album_file>index\.json|[A-Za-z0-9_-]+-(?:portrait|landscape)\.jpg)$" {
    alias /var/lib/ylct-wallpapers/$album_day/$album_city/$album_file;
    add_header Cache-Control "public, max-age=172800, immutable";
}
location /wallpapers/v2/ { return 404; }
